name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./TransGGP

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore TransGGP.slnx

      - name: Compilar
        run: dotnet build TransGGP.slnx --configuration Release --no-restore

      - name: Correr pruebas
        run: dotnet test TransGGP.slnx --configuration Release --no-build
